name: Deploy prod

on:
  push:
    branches: [main]

jobs:
  deploy:
    uses: Sud-Austral/infra-docker-base/.github/workflows/deploy.yml@main
    with:
      app_name: ${{ github.event.repository.name }}
      # La versión de esta aplicación: el archivo VERSION de la raíz (MAYOR.MENOR) más el
      # número de esta corrida; el build la recibe como APP_VERSION. Lo puso
      # semilla/patrones/version/aplicar.py.
      versionar: true
