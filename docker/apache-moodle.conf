# Configuración de Apache para Moodle — CONAF

# En Moodle 5.2 la raíz web es public/, no la raíz del repositorio. El
# DocumentRoot lo cambia el Dockerfile sobre el vhost por defecto; acá van los
# permisos del directorio que corresponde.
<Directory /var/www/html/public>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Y la raíz del repositorio NO se sirve. Ahí viven config.php —con la clave de
# la base dentro—, admin/cli/ y composer.json. Que el DocumentRoot apunte a
# public/ ya lo deja fuera; esto es la segunda barrera, por si alguien agrega un
# Alias o mueve el vhost.
<Directory /var/www/html>
    Require all denied
</Directory>

# El smoke test del despliegue CONAF pide GET /health. Moodle no tiene ese
# endpoint, así que se sirve health.php bajo esa ruta sin extensión.
Alias /health /var/www/html/public/health.php

# La IP real del visitante en los logs de Moodle cuando hay Nginx delante; si no,
# todos los accesos quedarían registrados con la IP del proxy.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 172.31.2.0/24

# moodledata nunca debe ser accesible por web. En esta imagen no está bajo el
# DocumentRoot, así que esto es una segunda barrera por si alguien mueve algo.
<DirectoryMatch "^/var/moodledata">
    Require all denied
</DirectoryMatch>

# No anunciar versión de Apache ni de PHP.
ServerTokens Prod
ServerSignature Off

# ─── MPM prefork ─────────────────────────────────────────────────────────────
# Este bloque gana sobre mods-enabled/mpm_prefork.conf: apache2.conf incluye
# conf-enabled/*.conf (línea 222) DESPUÉS de mods-enabled/*.conf (línea 147).
# Verificado en el contenedor el 30-07-2026.
#
# El límite NO es la memoria. Se midió el coste marginal real por hijo con
# Private_Dirty + Private_Clean desde el host: 8 MB. Los ~101 MB de RSS que
# muestra `ps` son engañosos, porque RSS cuenta N veces el mapeo compartido de
# OPcache (256 MB) y las bibliotecas. Con 150 hijos serían ~1,2 GB, no 15 GB, y
# el servidor tiene 8 GB libres: por memoria cabrían los 150 sin problema.
#
# El límite real es PostgreSQL, no la memoria. Cada petición PHP de Moodle toma
# una conexión mientras dura, así que MaxRequestWorkers nunca debe superar el
# CONNECTION LIMIT del rol `academia` menos lo que consume el cron: si lo supera,
# la petición sobrante recibe `FATAL: too many connections for role "academia"` y
# el usuario ve un error 500. Con el tope puesto por debajo, esas peticiones
# ESPERAN en Apache en vez de FALLAR: lento es mejor que roto.
#
# El 31-07-2026 el administrador de 172.31.2.40 amplió el límite del rol de 20 a
# 60 (y de paso max_connections 100 -> 300 y work_mem 64MB -> 16MB). Verificado:
#   SELECT rolconnlimit FROM pg_roles WHERE rolname='academia';   -> 60
#
#   50 web + ~2 del contenedor cron + margen para CLI = 60
#
# 50 y NO MÁS, aunque sobre RAM: pasar de 60 vuelve a producir errores 500.
#
# Esa cuenta se hizo cuando había UN solo sitio colgando del rol, y por eso se
# gasta los 60 enteros. Ya no es así: desde el 31-08-2026 son dos sitios
# permanentes, y el 50 pasó a ser la parte del campus, no el total. El reparto
# está más abajo.
#
# Y la frase que decía "si algún día se amplía otra vez el límite del rol, este
# número sube con él" quedó sin efecto el 31-08-2026: se decidió NO volver a
# pedir ampliación y NO crear un rol de PostgreSQL aparte para la Academia. 60
# es todo lo que va a haber, así que lo que tome un sitio se lo quita al otro.
#
# La memoria no restringe: el coste marginal medido por hijo es 8 MB de memoria
# privada (Private_Dirty+Private_Clean desde el host). Los ~101 MB que muestra
# `ps` son engañosos, porque RSS cuenta N veces el mapeo compartido de OPcache
# (256 MB) y las bibliotecas. 50 hijos son ~400 MB sobre 8 GB libres.
#
# Medido con 16 workers antes de este cambio: ~42 peticiones/s en páginas
# típicas y ~11/s en una página de curso de 942 KB, con la CPU al 52 % — es
# decir, había capacidad de sobra desaprovechada por el tope.
#
# ─── EL REPARTO DEL TECHO, QUE DEJÓ DE SER TEMPORAL ─────────────────────────
# El 50 de arriba es la parte de coipo_moodle, el campus del 8115. Aquí va 6
# porque el CONNECTION LIMIT es del ROL y las dos instancias se reparten un
# solo techo de 60:
#
#     50  coipo_moodle (campus, puerto 8115)
#   +  6  coipo_academia (esta, puerto 8116)
#   +  2  los dos contenedores cron
#   +  2  margen: los `exec` de academia/cli y un psql de diagnóstico
#   ───────
#     60  el límite del rol, exacto y sin sobra
#
# Lo que cambió el 31-08-2026 no es el número: es su plazo. Antes acá decía "al
# promover v2, subir a 50 y apagar la instancia vieja". Esa frase ya no vale,
# porque no se apaga nada — los dos sitios conviven de forma permanente. Y en la
# misma decisión quedó dicho que NO se pide otra ampliación del CONNECTION LIMIT
# y NO se crea un rol de PostgreSQL aparte para la Academia.
#
# Consecuencia incómoda y hay que mirarla de frente: 6 dejó de ser "un entorno
# de una o dos personas" y pasó a ser el techo de un sitio que va a tener gente
# adentro. Seis workers con tráfico real no dan un error — dan peticiones
# encoladas y una lentitud que no aparece en ningún log. Por eso el reparto
# tiene que moverse, y por eso está escrito acá adónde se mueve.
#
# ─── Los tres estados del reparto ───────────────────────────────────────────
#
#   momento                                   8115   8116   crones  margen  suma
#   ───────────────────────────────────────────────────────────────────────────
#   HOY · la Academia se construye, sin         50      6       2       2     60
#     usuarios de verdad
#   la Academia abre a usuarios y el campus     36     16       2       6     60
#     sigue siendo donde está la gente
#   el campus queda de solo consulta y la       16     36       2       6     60
#     gente ya está en la Academia
#
# La regla que genera cualquiera de esas filas, para no tener que rediscutirla:
#
#     workers(8115) + workers(8116) + 2 + 6  <=  rolconnlimit
#
# El margen de 6 no es relleno. Es lo que consumen los `docker compose exec` de
# academia/cli, un psql de diagnóstico y un pg_dump de respaldo, y los tres
# corren con el sitio arriba: con margen 0, el respaldo tumba el sitio.
#
# El 16 no es un número inventado: es el ÚNICO de este proyecto con una medición
# de carga detrás — con 16 workers se midieron ~42 peticiones/s en páginas
# típicas y ~11/s en la de curso de 942 KB con la CPU al 52 %, según el párrafo
# de más arriba. 42 peticiones/s son 151.200 páginas por hora, muy por encima de
# lo que generan 2.869 funcionarios. El 36 del otro lado, en cambio, es una
# elección y no una medición: le sobra a propósito, porque si alguna de las dos
# tiene que ir holgada es la que hoy tiene la gente adentro.
#
# ─── EL ORDEN IMPORTA, Y ES LA ÚNICA PARTE QUE PUEDE SALIR MAL ──────────────
# El MaxRequestWorkers del 8115 vive en OTRO repositorio (coipo_moodle). Son dos
# despliegues distintos y entre uno y otro hay una ventana de minutos en que las
# dos configuraciones conviven. Por eso:
#
#   1. PRIMERO baja el que baja. Alguien entra a coipo_moodle, deja
#      MaxRequestWorkers en 36, push a main, y espera a que el deploy termine.
#   2. Comprueba que el 8115 sigue respondiendo 200.
#   3. RECIÉN AHÍ sube el que sube: este archivo, de 6 a 16, push a main.
#
# Al revés, esa ventana suma 50 + 16 + 2 = 68 sobre un techo de 60, y el que
# recibe `FATAL: too many connections for role "academia"` es el sitio con 2.869
# personas adentro. Es el peor resultado posible y se produce por hacer los
# mismos dos cambios en el orden equivocado.
#
# Mientras el 8115 siga en 50, este número NO se sube: hoy no cabe. 60 menos 50
# menos los 2 crones deja 8, y con 6 puestos el margen ya está en 2.
#
# ─── Cómo se detecta que el reparto se quedó corto ──────────────────────────
# Son DOS síntomas distintos y se confunden todo el tiempo:
#
#   · `FATAL: too many connections for role "academia"` y un 500 → el reparto
#     está MAL SUMADO: los dos MaxRequestWorkers pasan del rolconnlimit. Es un
#     error de configuración, no de capacidad; se arregla bajando un número.
#   · Nada en el log y páginas lentas → el reparto está bien sumado y CORTO:
#     Apache está encolando. No hay error que buscar, y por eso cuesta verlo.
#
# Las consultas de pg_stat_activity que lo ven venir, con sus umbrales, están en
# la sección "Concurrencia" de .env.v2.example. La versión de bolsillo:
#
#   psql -h 172.31.2.40 -U academia -d academia_v2 -c \
#     "SELECT datname, count(*) FROM pg_stat_activity
#        WHERE usename='academia' GROUP BY datname;"
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         2
    MaxSpareServers         4
    # 16 cuando el campus del 8115 haya bajado a 36, y NO ANTES — ver el orden
    # de arriba. Hoy no cabe: 60 menos los 50 del campus menos 2 de crones deja
    # 8, y con 6 puestos el margen ya está en 2.
    MaxRequestWorkers       6

    # Venía en 0: los hijos no se reciclaban nunca y cualquier fuga de memoria
    # de PHP se acumulaba mientras el contenedor siguiera vivo.
    MaxConnectionsPerChild 1000
</IfModule>
