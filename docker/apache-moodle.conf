# Configuración de Apache para Moodle — CONAF

# En Moodle 5.2 la raíz web es public/, no la raíz del repositorio. El
# DocumentRoot lo cambia el Dockerfile sobre el vhost por defecto; acá van los
# permisos del directorio que corresponde.
<Directory /var/www/html/public>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Y la raíz del repositorio NO se sirve. Ahí viven config.php —con la clave de
# la base dentro—, admin/cli/ y composer.json. Que el DocumentRoot apunte a
# public/ ya lo deja fuera; esto es la segunda barrera, por si alguien agrega un
# Alias o mueve el vhost.
<Directory /var/www/html>
    Require all denied
</Directory>

# El smoke test del despliegue CONAF pide GET /health. Moodle no tiene ese
# endpoint, así que se sirve health.php bajo esa ruta sin extensión.
Alias /health /var/www/html/public/health.php

# La IP real del visitante en los logs de Moodle cuando hay Nginx delante; si no,
# todos los accesos quedarían registrados con la IP del proxy.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 172.31.2.0/24

# moodledata nunca debe ser accesible por web. En esta imagen no está bajo el
# DocumentRoot, así que esto es una segunda barrera por si alguien mueve algo.
<DirectoryMatch "^/var/moodledata">
    Require all denied
</DirectoryMatch>

# No anunciar versión de Apache ni de PHP.
ServerTokens Prod
ServerSignature Off

# ─── MPM prefork ─────────────────────────────────────────────────────────────
# Este bloque gana sobre mods-enabled/mpm_prefork.conf: apache2.conf incluye
# conf-enabled/*.conf (línea 222) DESPUÉS de mods-enabled/*.conf (línea 147).
# Verificado en el contenedor el 30-07-2026.
#
# El límite NO es la memoria. Se midió el coste marginal real por hijo con
# Private_Dirty + Private_Clean desde el host: 8 MB. Los ~101 MB de RSS que
# muestra `ps` son engañosos, porque RSS cuenta N veces el mapeo compartido de
# OPcache (256 MB) y las bibliotecas. Con 150 hijos serían ~1,2 GB, no 15 GB, y
# el servidor tiene 8 GB libres: por memoria cabrían los 150 sin problema.
#
# El límite real es PostgreSQL, no la memoria. Cada petición PHP de Moodle toma
# una conexión mientras dura, así que MaxRequestWorkers nunca debe superar el
# CONNECTION LIMIT del rol `academia` menos lo que consume el cron: si lo supera,
# la petición sobrante recibe `FATAL: too many connections for role "academia"` y
# el usuario ve un error 500. Con el tope puesto por debajo, esas peticiones
# ESPERAN en Apache en vez de FALLAR: lento es mejor que roto.
#
# El 31-07-2026 el administrador de 172.31.2.40 amplió el límite del rol de 20 a
# 60 (y de paso max_connections 100 -> 300 y work_mem 64MB -> 16MB). Verificado:
#   SELECT rolconnlimit FROM pg_roles WHERE rolname='academia';   -> 60
#
#   50 web + ~2 del contenedor cron + margen para CLI = 60
#
# 50 y NO MÁS, aunque sobre RAM: pasar de 60 vuelve a producir errores 500.
# Si algún día se amplía otra vez el límite del rol, este número sube con él —
# nunca al revés.
#
# La memoria no restringe: el coste marginal medido por hijo es 8 MB de memoria
# privada (Private_Dirty+Private_Clean desde el host). Los ~101 MB que muestra
# `ps` son engañosos, porque RSS cuenta N veces el mapeo compartido de OPcache
# (256 MB) y las bibliotecas. 50 hijos son ~400 MB sobre 8 GB libres.
#
# Medido con 16 workers antes de este cambio: ~42 peticiones/s en páginas
# típicas y ~11/s en una página de curso de 942 KB, con la CPU al 52 % — es
# decir, había capacidad de sobra desaprovechada por el tope.
#
# ─── PERO ESTE REPOSITORIO ES LA INSTANCIA v2, NO PRODUCCIÓN ────────────────
# El 50 de arriba es el número correcto para coipo_moodle, que es el que atiende
# a los 2.869 usuarios. Aquí va 6, porque el CONNECTION LIMIT es del ROL y las
# dos instancias comparten el mismo techo de 60:
#
#     50  coipo_moodle (producción, puerto 8115)
#   +  6  coipo_academia (esta, puerto 8116)
#   +  2  los dos contenedores cron
#   ───────
#     58  <= 60
#
# 6 alcanza de sobra para construir y verificar el modelo de datos: es un
# entorno de una o dos personas, no un sitio con tráfico.
#
# AL PROMOVER v2 A PRODUCCIÓN: subir a 50 y apagar la instancia vieja. Dejarlo
# en 6 con tráfico real produce peticiones encoladas y una lentitud que no tiene
# ninguna causa visible en los logs.
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         2
    MaxSpareServers         4
    MaxRequestWorkers       6

    # Venía en 0: los hijos no se reciclaban nunca y cualquier fuga de memoria
    # de PHP se acumulaba mientras el contenedor siguiera vivo.
    MaxConnectionsPerChild 1000
</IfModule>
