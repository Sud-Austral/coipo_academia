; Ajustes de PHP exigidos o recomendados por Moodle 4.5

memory_limit = 512M

; Moodle lo exige explícitamente: con el valor por defecto (1000) los
; formularios grandes —como la edición de un cuestionario— pierden datos en
; silencio al guardar.
max_input_vars = 5000

max_execution_time = 300
upload_max_filesize = 200M
post_max_size = 200M

date.timezone = America/Santiago

; No anunciar la versión de PHP en la cabecera X-Powered-By. Coherente con
; ServerTokens Prod de docker/apache-moodle.conf. Medido: venía en On.
expose_php = Off

; Las aserciones se compilan Y se ejecutan por defecto (zend.assertions = 1).
; La imagen oficial php:8.3-apache no instala ningún php.ini, así que regían los
; valores compilados. Verificado con php -i el 30-07-2026: estaba en 1.
; -1 hace que ni siquiera se compilen.
zend.assertions = -1

; ─── realpath cache ─────────────────────────────────────────────────────────
; Moodle hace miles de include/file_exists por petición sobre 18.094 archivos.
; NO se toca realpath_cache_size: medido en producción usa 0,03 MB de los 4 MB
; que trae por defecto, así que agrandarlo no serviría de nada. Lo que sí
; importa es el TTL: con 120 s la caché se vacía cada dos minutos (se midieron
; solo 231 entradas vivas). El código de esta imagen solo cambia cuando se
; despliega una imagen nueva, así que 600 s es seguro.
realpath_cache_ttl = 600

; ─── OPcache ────────────────────────────────────────────────────────────────
opcache.enable = 1
opcache.enable_cli = 0

; Medido el 30-07-2026 bajo Apache: 94,7 MB usados de 256 y 0,26 % desperdiciado.
; Sobra. Solo subir si oom_restarts > 0.
opcache.memory_consumption = 256

; ESTE ES EL AJUSTE QUE IMPORTA. Medido bajo Apache: 16,0 MB usados de 16,0 MB,
; free_memory 0,0 MB, 186.082 cadenas. El buffer está AGOTADO: al llenarse, PHP
; deja de internar cadenas y cada proceso hijo pasa a guardar su propia copia,
; lo que sube la memoria por petición. 16 -> 32 MB.
opcache.interned_strings_buffer = 32

; NO se sube a 32531 pese a lo que sugería mejoras.md: PHP redondea este valor
; al primo siguiente de su tabla interna, y 20000 ya da max_cached_keys = 32531.
; Verificado en vivo: 4.479 claves usadas de 32.531 (13,77 %), cache_full = no,
; hash_restarts = 0, oom_restarts = 0. Cambiarlo no tendría ningún efecto.
opcache.max_accelerated_files = 20000

opcache.revalidate_freq = 60

; Se deja en 1 a propósito. validate_timestamps = 0 ahorra un stat() por archivo,
; pero si alguien edita un archivo dentro del contenedor para depurar, el cambio
; no tiene efecto y se pierde una tarde buscando por qué.
opcache.validate_timestamps = 1

; Moodle avisa en el chequeo de salud del sitio si esto queda en 0.
opcache.save_comments = 1
