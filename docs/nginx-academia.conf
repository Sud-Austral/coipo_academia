# Vhost de Nginx para el Moodle de CONAF — academia.conaf.cl
#
# Copia de referencia de /etc/nginx/sites-available/academia.conaf.cl.conf en el
# servidor 172.31.2.41. NO lo despliega este repositorio: se versiona aquí para
# que no se pierda y para poder detectar divergencias.
#
# Sincronizado el 30-07-2026. Los otros dos vhosts del servidor
# (coipo_prensa2.conf, iam.conaf.cl.conf) siguen exactamente este mismo patrón.
#
# ─────────────────────────────────────────────────────────────────────────────
# DÓNDE VIVE EL TLS — importante, y no es acá
#
#   academia.conaf.cl  ->  172.31.2.100   balanceador Radware Alteon
#                                          termina el TLS (cookie AlteonP)
#                                          redirige http:// a https:// con 307
#                              |  HTTP plano
#                              v
#                          172.31.2.41:80  este vhost
#                              |
#                              v
#                          contenedor app, 127.0.0.1:8115
#
# Por eso este archivo escucha SOLO en el puerto 80 y no lleva certificado: el
# certificado está en el Alteon, que lo administra Informática. No hay que poner
# `listen 443 ssl` acá ni pedir el .pem — sería duplicar el TLS sin necesidad.
#
# La contraparte obligatoria está en el .env del servidor, las dos a la vez:
#   MOODLE_WWWROOT=https://academia.conaf.cl
#   MOODLE_SSLPROXY=true
#
# Con https:// y sslproxy=false, Moodle genera las URLs de sus recursos con
# http:// dentro de una página servida por https://, el navegador las bloquea
# por contenido mixto y el sitio aparece SIN CSS ni JS y sin ningún error
# visible. Pasó exactamente eso el 30-07-2026.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    # La IP permite entrar para diagnóstico sin pasar por el balanceador. Ojo:
    # Moodle solo admite UNA url canónica ($CFG->wwwroot) — ver la nota final.
    server_name academia.conaf.cl 172.31.2.41;

    access_log /var/log/nginx/academia.access.log;
    error_log  /var/log/nginx/academia.error.log;

    # 200m para acompañar a upload_max_filesize/post_max_size de docker/php.ini.
    # Con el 25m habitual, los paquetes SCORM y los respaldos .mbz de curso
    # fallan con un 413 que no deja rastro en los registros de Moodle.
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8115;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Moodle compara este header contra wwwroot: sin él, bucle de redirección.
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Restaurar un curso grande o reconstruir el índice de búsqueda supera
        # los 5 minutos: con 300s la petición se corta a la mitad del trabajo.
        proxy_connect_timeout  60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# NOTA — Moodle tiene UNA sola URL
#
# $CFG->wwwroot es un valor único: Moodle no soporta responder en varias
# direcciones a la vez. Entrar por una URL distinta a la configurada provoca
# redirecciones al wwwroot, sesiones que se pierden o CSS que no carga.
#
# La URL canónica es https://academia.conaf.cl. Entrar por http://172.31.2.41/
# sigue funcionando para diagnóstico, pero no es la URL del servicio.
#
# El DNS ya resuelve (verificado el 30-07-2026 contra pimiento.conaf.cl:
# academia.conaf.cl -> 172.31.2.100), así que ya no hace falta la entrada en
# hosts ni el --host-resolver-rules del navegador que se usaban antes.
# ─────────────────────────────────────────────────────────────────────────────
