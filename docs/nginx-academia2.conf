# Vhost de Nginx para la Academia CONAF — academia2.conaf.cl
#
# Copia de referencia de /etc/nginx/sites-available/academia2.conaf.cl.conf en
# el servidor 172.31.2.41. NO lo despliega este repositorio: se versiona aquí
# para que no se pierda y para poder detectar divergencias.
#
# Es el hermano de docs/nginx-academia.conf. Los dos sitios conviven en el mismo
# servidor y NO se reemplazan:
#
#   academia.conaf.cl   ->  coipo_moodle    :8115  Moodle 4.5.10  el campus actual
#   academia2.conaf.cl  ->  coipo_academia  :8116  Moodle 5.2.1   esta Academia
#
# ─────────────────────────────────────────────────────────────────────────────
# DÓNDE VIVE EL TLS — importante, y no es acá
#
#   academia2.conaf.cl ->  172.31.2.100   balanceador Radware Alteon
#                                          termina el TLS (cookie AlteonP)
#                                          redirige http:// a https:// con 307
#                              |  HTTP plano
#                              v
#                          172.31.2.41:80  este vhost
#                              |
#                              v
#                          contenedor app, 127.0.0.1:8116
#
# Igual que su hermano, este archivo escucha SOLO en el puerto 80 y no lleva
# certificado. El certificado del Alteon es COMODÍN y ya cubre este nombre:
#
#   subject=  CN=*.conaf.cl,  O=Corporacion Nacional Forestal,  C=CL
#   X509v3 Subject Alternative Name:  DNS:*.conaf.cl, DNS:conaf.cl
#
# Verificado el 31-08-2026 contra 172.31.2.100:443 con SNI academia2.conaf.cl:
# el handshake completa con `Verify return code: 0 (ok)`. No hay que pedir un
# certificado nuevo ni poner `listen 443 ssl` acá.
#
# ─────────────────────────────────────────────────────────────────────────────
# LO QUE FALTA Y NO ESTÁ EN ESTE ARCHIVO — el servicio virtual del Alteon
#
# Medido el 31-08-2026, el estado del dominio era:
#
#   nslookup academia2.conaf.cl        -> 172.31.2.100          ✅ el DNS ya está
#   http://academia2.conaf.cl/         -> 307 a https           ✅ el Alteon lo conoce
#   TLS con SNI academia2.conaf.cl     -> handshake ok          ✅ el comodín sirve
#   GET / con Host: academia2.conaf.cl -> RESPUESTA VACÍA       ❌ no hay backend
#
# El Alteon acepta el TLS y después cierra la conexión sin reenviar a nadie. Es
# decir: falta el servicio virtual que mande academia2.conaf.cl al pool del
# 172.31.2.41. Eso lo configura Informática en el balanceador, no se arregla
# desde este servidor. Sin ese paso, este vhost puede estar perfecto y el sitio
# seguir sin responder por su dominio.
#
# ─────────────────────────────────────────────────────────────────────────────
# LA CONTRAPARTE OBLIGATORIA EN EL .env — las dos líneas van juntas o ninguna
#
#   MOODLE_WWWROOT=https://academia2.conaf.cl
#   MOODLE_SSLPROXY=true
#   MOODLE_REVERSEPROXY=false
#
# Con https:// y sslproxy=false, Moodle genera las URLs de sus recursos con
# http:// dentro de una página servida por https://, el navegador las bloquea
# por contenido mixto y el sitio aparece SIN CSS ni JS y sin ningún error
# visible. Pasó exactamente eso con academia.conaf.cl el 30-07-2026.
#
# Al revés (http:// + sslproxy=true) las cookies salen Secure y el login deja
# de funcionar.
#
# Y reverseproxy se queda en FALSE aunque haya dos proxys delante:
# lib/setuplib.php aborta si el Host recibido coincide con el de wwwroot.
#
# Al cambiar wwwroot hay que purgar cachés y recompilar el CSS del tema:
#   docker compose exec -u www-data app php admin/cli/purge_caches.php
#   docker compose exec -u www-data app php admin/cli/build_theme_css.php
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;

    # OJO — a diferencia de nginx-academia.conf, acá NO va `172.31.2.41`.
    # Ese server_name ya lo reclama el vhost de academia.conaf.cl. Repetirlo
    # produce el aviso "conflicting server name" al recargar Nginx y uno de los
    # dos gana en silencio, según el orden de carga de sites-enabled. Para
    # entrar por IP a diagnosticar esta instancia se usa el puerto del
    # contenedor directamente: http://172.31.2.41:8116/
    server_name academia2.conaf.cl;

    access_log /var/log/nginx/academia2.access.log;
    error_log  /var/log/nginx/academia2.error.log;

    # 200m para acompañar a upload_max_filesize/post_max_size de docker/php.ini.
    # Con el 25m habitual, los paquetes SCORM y los respaldos .mbz de curso
    # fallan con un 413 que no deja rastro en los registros de Moodle.
    client_max_body_size 200m;

    location / {
        # 8116, no 8115. El 8115 es el campus actual y sigue en pie.
        proxy_pass http://127.0.0.1:8116;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Moodle compara este header contra wwwroot: sin él, bucle de redirección.
        # $connection_upgrade viene del `map` del http block, que ya existe en
        # este servidor porque lo usan los otros tres vhosts.
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Restaurar un curso grande o reconstruir el índice de búsqueda supera
        # los 5 minutos: con 300s la petición se corta a la mitad del trabajo.
        proxy_connect_timeout  60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# CÓMO SE INSTALA Y SE COMPRUEBA
#
#   cp docs/nginx-academia2.conf /etc/nginx/sites-available/academia2.conaf.cl.conf
#   ln -s /etc/nginx/sites-available/academia2.conaf.cl.conf /etc/nginx/sites-enabled/
#   nginx -t                       # debe decir "syntax is ok" y "test is successful"
#   systemctl reload nginx
#
# `nginx -t` es el que avisa del choque de server_name si alguien vuelve a
# poner la IP acá. No saltárselo.
#
# Verificación, en este orden — cada una comprueba una capa distinta:
#
#   1. curl -sI http://127.0.0.1:8116/health          el contenedor responde
#   2. curl -sI -H 'Host: academia2.conaf.cl' \
#             http://127.0.0.1/health                 el vhost enruta bien
#   3. curl -sI https://academia2.conaf.cl/health     el Alteon reenvía
#
# Si 1 y 2 dan 200 y 3 no responde, el problema es el servicio virtual del
# Alteon y no hay nada que arreglar en este servidor.
#
# Con el sitio arriba, la cookie de sesión tiene que salir marcada `secure`:
#   curl -sI https://academia2.conaf.cl/login/index.php | grep -i set-cookie
# Si sale sin `secure`, MOODLE_SSLPROXY quedó en false.
# ─────────────────────────────────────────────────────────────────────────────
